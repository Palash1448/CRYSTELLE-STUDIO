<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crystelle Studio — Handcrafted Candles & Fragrances</title>
    <meta name="description" content="Handcrafted candles to create a warmer, brighter and calmer space." />
    <meta name="theme-color" content="#FAF8F5" />
    <link rel="icon" href="/pearl-crystelle-favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/pearl-crystelle-favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" />
    <script>
      (function() {
        var path = window.location.pathname;
        if (path === '/index.html') {
          var redirect = window.sessionStorage.getItem('crystelle_spa_path');
          if (redirect) {
            window.sessionStorage.removeItem('crystelle_spa_path');
            window.location.replace(redirect);
          } else {
            window.location.replace('/');
          }
        }
      })();
    </script>
  </head>
  <body style="margin:0;padding:0;background:#FAF8F5;font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:#1C1917;min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <div style="text-align:center;padding:24px;max-width:420px;">
      <div style="width:36px;height:36px;margin:0 auto 16px;border:3px solid #C59A44;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <h1 style="font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;margin:0 0 8px;color:#1C1917;letter-spacing:0.02em;">Crystelle Studio</h1>
      <p style="font-size:13px;color:#78716C;margin:0;letter-spacing:0.06em;text-transform:uppercase;">Handcrafted Candles & Fragrances</p>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </body>
</html>
